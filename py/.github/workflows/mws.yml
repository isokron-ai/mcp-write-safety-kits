# Tests the kit, then runs mcp-writecheck against the example server (examples/notes_server).
#
# The example's store lives in the server's memory and the tester starts the server itself, so the
# full run writes only to a store that exists for that run. It still makes real writes: point the
# manifest only at a test environment.
#
# Until mcp-writecheck is on npm (@mcp-write-safety/writecheck), the action fetches it from a private
# repository, so every step that uses the action needs cli-token: a fine-grained token with read
# access to that repository's contents, stored as the secret MWS_CLI_TOKEN. GitHub does not give
# secrets to workflows run for a pull request from a fork, so the writecheck jobs skip those.
#
# REPLACE before use: the action reference below, pinned to a full commit SHA.

name: mws

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        sdk: ["mcp>=1.10,<2", "mcp>=2,<3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the kit with the SDK line under test
        run: python -m pip install -e ".[test]" "${{ matrix.sdk }}"
      - name: Unit and integration tests
        run: python -m pytest -q

  writecheck:
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # One run at a time: two runs against one test environment would be each other's second writer.
    concurrency:
      group: mws-writecheck
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the kit (the manifest starts the server with `python server.py`)
        run: python -m pip install -e .

      # Plan: every call a run would make, and the plan hash. No tool is called.
      - uses: isokron-ai/mcp-writecheck-action@0000000000000000000000000000000000000000 # REPLACE: pin to a full commit SHA
        with:
          manifest: examples/notes_server/writecheck.yaml
          mode: plan
          artifact-name: mws-plan
          cli-token: ${{ secrets.MWS_CLI_TOKEN }}

      # Catalog only: MWS-ANN-4 from tools/list.
      - uses: isokron-ai/mcp-writecheck-action@0000000000000000000000000000000000000000 # REPLACE: pin to a full commit SHA
        with:
          manifest: examples/notes_server/writecheck.yaml
          mode: catalog
          fail-on: any
          artifact-name: mws-catalog
          cli-token: ${{ secrets.MWS_CLI_TOKEN }}

      # Full run. The plan hash is the one a person read and accepted (mcp-writecheck plan, CLI 0295ed6);
      # when the manifest or the tool catalog changes, the run is refused until it is updated here.
      - uses: isokron-ai/mcp-writecheck-action@0000000000000000000000000000000000000000 # REPLACE: pin to a full commit SHA
        with:
          manifest: examples/notes_server/writecheck.yaml
          mode: full
          fail-on: must
          confirm-target: notes-server
          plan-hash: 726b2769d56a6dd5
          artifact-name: mws-results
          cli-token: ${{ secrets.MWS_CLI_TOKEN }}
