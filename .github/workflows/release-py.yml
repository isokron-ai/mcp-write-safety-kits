# Publishes the Python kit (py/, PyPI project mcp-write-safety-kit) when a tag py-v<version> is pushed.
#
# PyPI trusted publishing (OIDC): no token is stored anywhere. PyPI accepts the upload only from this
# repository, this workflow file (release-py.yml) and the environment named pypi, as registered on
# PyPI. The pypi environment requires a reviewer's approval before the publish job runs.
#
# The tag must match py/pyproject.toml: tag py-v0.1.0 publishes version 0.1.0, any other tag fails.

name: release-py

on:
  push:
    tags: ["py-v*"]

permissions:
  contents: read

concurrency:
  group: release-py
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: The tag matches the version in pyproject.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$TAG" != "py-v$version" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $version (expected py-v$version)"
            exit 1
          fi
      - name: Tests
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q
      - name: Build the sdist and the wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: py-dist
          path: py/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/mcp-write-safety-kit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: py-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
