# Publishes the TypeScript kit (ts/, npm package @mcp-write-safety/kit) when a tag ts-v<version> is pushed.
#
# npm trusted publishing (OIDC): no npm token is stored anywhere. npm accepts the publish only from this
# repository, this workflow file (release-ts.yml) and the environment named npm, as registered on npm
# (npmjs.com > @mcp-write-safety/kit > Settings > Trusted Publisher > GitHub Actions: isokron-ai /
# mcp-write-safety-kits / release-ts.yml / npm). The npm environment requires a reviewer's approval before
# the publish job runs. Provenance is attached because the repository and the package are public.
#
# The tag must match ts/package.json: tag ts-v0.1.1 publishes version 0.1.1, any other tag fails.
# Requirements (npm docs): npm CLI 11.5.1 or later and Node 22.14.0 or later, on a GitHub-hosted runner.

name: release-ts

on:
  push:
    tags: ["ts-v*"]

permissions:
  contents: read

concurrency:
  group: release-ts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: The tag matches the version in package.json, and the version is not on npm yet
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "ts-v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version (expected ts-v$version)"
            exit 1
          fi
          case "$version" in *-*) echo "::error::prerelease $version: publish it by hand with --tag"; exit 1 ;; esac
          if npm view "@mcp-write-safety/kit@$version" version >/dev/null 2>&1; then
            echo "::error::@mcp-write-safety/kit@$version is already on npm"
            exit 1
          fi
      - name: Tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Dry run (what would be published)
        run: npm publish --dry-run --access public

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the npm Trusted Publisher entry names this environment; it also holds the owner's approval
    environment:
      name: npm
      url: https://www.npmjs.com/package/@mcp-write-safety/kit
    permissions:
      contents: read
      id-token: write   # the OIDC token npm exchanges for a short-lived publish credential (and signs provenance with)
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # no registry-url: setup-node would write an .npmrc with a placeholder token, and a failed OIDC exchange
      # would then show as a 401/404 on that token instead of npm's ENEEDAUTH
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10
      - name: npm 11
        run: npm install -g npm@^11.5.1 --no-audit --no-fund --loglevel=error && npm --version
      - name: Build and publish
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm publish --provenance --access public
