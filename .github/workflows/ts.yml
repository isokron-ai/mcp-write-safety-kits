# Unit tests of the TypeScript kit (ts/) and of its example server, on every push and pull request.

name: ts

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Kit tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Example server tests
        working-directory: ts/examples/notes-server
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
