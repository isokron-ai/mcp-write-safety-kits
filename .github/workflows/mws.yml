# Runs the mcp-writecheck tester (MWS 0.9) against both example servers, through the
# isokron-ai/mcp-writecheck-action. Started by hand only.
#
# The tester is public (isokron-ai/mcp-write-safety): the action fetches and builds it at CLI_REF
# with no token, and both jobs run on every dispatch.
#
# Each example keeps its store in the server's memory, and the tester starts the server itself on
# the runner, so a full run writes only to a store that exists for that run.
#
# The plan hashes below were read and accepted for the tester at CLI_REF. A change to an example,
# its manifest or CLI_REF changes the plan; the full run is then refused until the hash here is
# updated from the plan step's summary, after reading the plan.

name: mws

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mws
  cancel-in-progress: false

env:
  # mcp-writecheck 0.1.0 (MWS 0.9) at the public isokron-ai/mcp-write-safety 3af41c6. It cannot adopt a
  # result shape by name and version, so each manifest reads the kits' first text block (spec 7.3, rule 11).
  CLI_REF: 3af41c6fb79d66afdea41ebcabc6f7fc18e77c6a
  TS_PLAN_HASH: 1d6ef094bc58188f
  PY_PLAN_HASH: abd730313afc7ed2

jobs:
  ts-notes-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build the kit and the example
        working-directory: ts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund && npm run build
          cd examples/notes-server && npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - uses: isokron-ai/mcp-writecheck-action@d610653680d9083dadee208e2ea0de8bbc1e98b1 # v0.1.2
        with:
          manifest: ts/examples/notes-server/writecheck.yaml
          mode: plan
          cli-ref: ${{ env.CLI_REF }}
          artifact-name: mws-ts-plan
      - uses: isokron-ai/mcp-writecheck-action@d610653680d9083dadee208e2ea0de8bbc1e98b1 # v0.1.2
        with:
          manifest: ts/examples/notes-server/writecheck.yaml
          mode: full
          fail-on: must
          confirm-target: notes-server
          plan-hash: ${{ env.TS_PLAN_HASH }}
          cli-ref: ${{ env.CLI_REF }}
          artifact-name: mws-ts-results

  py-notes-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the kit (the manifest starts the server with `python server.py`)
        working-directory: py
        run: python -m pip install -e . "mcp>=2,<3"
      - uses: isokron-ai/mcp-writecheck-action@d610653680d9083dadee208e2ea0de8bbc1e98b1 # v0.1.2
        with:
          manifest: py/examples/notes_server/writecheck.yaml
          mode: plan
          cli-ref: ${{ env.CLI_REF }}
          artifact-name: mws-py-plan
      - uses: isokron-ai/mcp-writecheck-action@d610653680d9083dadee208e2ea0de8bbc1e98b1 # v0.1.2
        with:
          manifest: py/examples/notes_server/writecheck.yaml
          mode: full
          fail-on: must
          confirm-target: notes-server
          plan-hash: ${{ env.PY_PLAN_HASH }}
          cli-ref: ${{ env.CLI_REF }}
          artifact-name: mws-py-results
